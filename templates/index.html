<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>내 기술 스택</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8">
    <h1 class="text-2xl font-bold mb-4">내 기술 스택</h1>

    <div class="flex gap-2 flex-wrap">
        {% for skill in skills %}
            <span class="bg-green-300 text-white px-3 py-1 rounded-full">{{ skill }}</span>
        {% endfor %}
    </div>

    <form action="/send" method="post" class="mt-8 flex gap-2 flex-wrap">
        <input type="text" name="skill" placeholder="기술명" required
               class="border px-3 py-2 rounded">
        <input type="text" name="level" placeholder="난이도" required
               class="border px-3 py-2 rounded">
        <input type="text" name="status" placeholder="학습 상태" required
               class="border px-3 py-2 rounded">
        <button type="submit" class="bg-black text-white px-3 py-2 rounded">전송</button>
    </form>

    <div>
        <h2 class="mt-9 text-xl font-bold">입력한 데이터</h2>

        <form action="/delete_all" method="post" class="mb-2"
              onsubmit="return confirm('정말 전체 삭제하시겠습니까?');">
            <button type="submit" class="bg-black text-white px-4 py-2 rounded">
                전체 삭제
            </button>
        </form>

        {% for item in messages %}
            <form id="delete-{{ item['id'] }}" action="/delete/{{ item['id'] }}" method="post"></form>
            <form id="edit-{{ item['id'] }}" action="/edit/{{ item['id'] }}" method="get"></form>
        {% endfor %}

        <form action="/delete_selected" method="post"
              onsubmit="return confirm('선택한 데이터를 삭제하시겠습니까?');">
            {% for item in messages %}
            <div class="bg-yellow-200 p-2 m-2 rounded flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <input type="checkbox" name="delete_ids" value="{{ item['id'] }}">
                    <span>
                        #{{ item["id"] }}
                        {{ item["skill"] }}
                        / {{ item["level"] }}
                        / {{ item["status"] }}
                    </span>
                </div>
                <div>
                    <button type="submit" form="delete-{{ item['id'] }}"
                            onclick="return confirm('정말 삭제할까요?')"
                            class="ml-2 bg-red-500 text-white px-3 py-1 rounded">삭제</button>
                    <button type="submit" form="edit-{{ item['id'] }}"
                            class="ml-2 bg-blue-500 text-white px-3 py-1 rounded">수정</button>
                </div>
            </div>
            {% endfor %}

            <button type="submit" class="mt-4 bg-red-500 text-white px-4 py-2 rounded">
                선택 삭제
            </button>
        </form>
    </div>
</body>
</html>
